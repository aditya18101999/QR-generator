<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart QR System{% endblock %}</title>
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['var(--font-sans)', 'sans-serif'],
                        display: ['var(--font-display)', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- Header/Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform duration-200">
                    <i class="fa-solid fa-qrcode text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight">Antigravity QR</h1>
                    <p class="text-[10px] text-slate-400 font-medium">Smart Contact System</p>
                </div>
            </a>
            
            <nav class="flex items-center gap-4">
                <a href="/" class="text-sm font-semibold text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-chart-line mr-1 text-slate-500"></i> Dashboard
                </a>
                <span class="text-slate-800">|</span>
                <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded-full font-medium">
                    v2.0 Production
                </span>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Antigravity Systems. All rights reserved.</p>
    </footer>

    <!-- Custom Javascript -->
    <script src="/static/js/main.js"></script>
</body>
</html>
